<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dravex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0c0c;
      --bg-2: #101010;
      --panel: #141414;
      --line: #1f1f1f;
      --line-2: #2a2a2a;
      --fg: #8b8b8b;
      --fg-dim: #555;
      --fg-bright: #cfcfcf;
      --key: #9eb59a;
      --sel: #1b1b1b;
      --bar: #cfc9b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 13px;
      letter-spacing: 0.01em;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .app { display: grid; grid-template-rows: 36px 1fr 22px; height: 100%; }
    .titlebar {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      border-bottom: 1px solid var(--line); padding: 0 14px; color: var(--fg-dim); font-size: 11px;
    }
    .titlebar .brand { justify-self: start; color: var(--fg); cursor: pointer; }
    .titlebar .mid {
      background: linear-gradient(90deg, #6e6e6e 0%, #9eb59a 18%, #7ec8e3 36%, #c4a0e8 54%, #e3b07e 72%, #9eb59a 86%, #6e6e6e 100%);
      background-size: 280% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: hueFlow 9s linear infinite;
    }
    .titlebar .right { justify-self: end; }
    .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 0; }
    .sidebar { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 10px 0 24px; }
    .sidebar .label {
      padding: 6px 14px 10px; font-size: 10px; letter-spacing: 0.18em;
      text-transform: lowercase; color: var(--fg-dim);
    }
    .tree-folder > .head, .tree-file {
      width: 100%; display: flex; align-items: center; gap: 8px; min-height: 28px;
      padding: 0 14px; text-align: left; color: var(--fg);
    }
    .tree-file { padding-left: 28px; }
    .tree-folder.nested .tree-file { padding-left: 36px; }
    .tree-file.on { background: var(--sel); color: var(--fg-bright); box-shadow: inset 2px 0 0 var(--bar); }
    .tree-file:hover, .tree-folder > .head:hover { color: var(--fg-bright); }
    .chev { width: 10px; display: inline-block; color: var(--fg-dim); transition: transform .18s ease; }
    .tree-folder.open > .head .chev { transform: rotate(90deg); }
    .tree-folder .kids { display: none; }
    .tree-folder.open .kids { display: block; }
    .workspace { display: grid; grid-template-rows: 34px 1fr; min-width: 0; min-height: 0; }
    .tabs { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); background: var(--bg-2); }
    .tab {
      display: flex; align-items: center; padding: 0 16px; position: relative;
      background: linear-gradient(90deg, #cfcfcf 0%, #9eb59a 22%, #7ec8e3 44%, #c4a0e8 66%, #cfcfcf 100%);
      background-size: 280% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: tabIn .34s cubic-bezier(.22,1,.36,1), hueFlow 8s linear infinite;
    }
    .tab::after {
      content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 1px;
      background: linear-gradient(90deg, #9eb59a, #7ec8e3, #c4a0e8, #9eb59a);
      background-size: 220% 100%; animation: hueFlow 8s linear infinite;
    }
    @keyframes tabIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
    .editor { overflow: auto; padding: 28px 8vw 64px; }
    .editor.swap { animation: fade .4s cubic-bezier(.22,1,.36,1); }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .path { margin-bottom: 22px; font-size: 12px; display: flex; align-items: center; gap: 8px; }
    .path-title {
      display: inline-block;
      background: linear-gradient(90deg, #8a8a8a 0%, #9eb59a 16%, #7ec8e3 32%, #b7a0e8 48%, #e3b07e 64%, #9eb59a 80%, #8a8a8a 100%);
      background-size: 300% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: hueFlow 7s linear infinite;
    }
    .caret {
      display: inline-block; width: 7px; height: 13px; vertical-align: -1px;
      background: linear-gradient(180deg, #9eb59a, #7ec8e3, #c4a0e8, #e3b07e, #9eb59a);
      background-size: 100% 300%;
      animation: blink 1.05s steps(1) infinite, caretHue 5s linear infinite;
      box-shadow: 0 0 8px rgba(126,200,227,.35);
    }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes hueFlow { from { background-position: 0% 50%; } to { background-position: 200% 50%; } }
    @keyframes caretHue {
      from { background-position: 0% 0%; filter: hue-rotate(0deg); }
      to { background-position: 0% 100%; filter: hue-rotate(360deg); }
    }
    .sec { color: var(--fg-bright); margin: 22px 0 10px; font-weight: 500; font-size: 13px; }
    .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 28px; max-width: 720px; }
    .kv .k { color: var(--key); }
    .kv .v { color: var(--fg); }
    .list { list-style: none; max-width: 720px; }
    .list li { padding: 3px 0 3px 16px; position: relative; }
    .list li::before { content: "-"; position: absolute; left: 0; color: var(--fg-dim); }
    .prose { max-width: 720px; line-height: 1.7; }
    .prose p { margin: 0 0 14px; }
    .prose pre { white-space: pre-wrap; line-height: 1.7; color: var(--fg); }
    .plate { margin-top: 22px; border: 1px solid var(--line-2); background: #0a0a0a; max-width: 640px; padding: 8px; }
    .plate img { width: 100%; display: block; background: #d8d8d8; }
    .plate .cap { color: var(--fg-dim); font-size: 11px; padding: 8px 4px 2px; }
    .status {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      border-top: 1px solid var(--line); padding: 0 12px; color: var(--fg-dim); font-size: 11px;
    }
    .status .c { text-align: center; }
    .status .r { text-align: right; }
    @media (max-width: 760px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { display: none; position: absolute; inset: 36px 0 22px 0; z-index: 5; }
      .sidebar.open { display: block; }
      .kv { grid-template-columns: 1fr; gap: 2px 0; }
      .editor { padding: 22px 18px 48px; }
    }
  </style>
</head>

      "overview.md": { folder: "design", text: `Dravex is fast PvP built on modular cores. A core is the loadout: weapon behavior, abilities, grenade, crush, kill, sound, and UI tint.

## loop
- Select or load a core
- Primary fire (auto-charge)
- Manage four-shot power
- Crush, grenade, or combine
- Beacon for reposition
- Eliminate

## goals
- Distinct core identities
- Readable VFX under fire
- Skill expression (when to crush / throw / fold)
- High visual quality without server load` },

      "systems.md": { folder: "design", text: `bandolier    multiple cores on-body. faux buckle is the beacon button.
auto-charge  press fire → short charge (audio + vis) → discharge
crush        squeeze a core. four hand shards. four uses. then gone.
grenades     throw a raw core. unique burst / fade / kill. can launch the user.
combinations loaded ≠ thrown → cataclysm
beacon       throw mark. buckle dematerializes up, rematerializes on mark.
rain power   ejected core keeps leftover shots (1/4–3/4). 4/4 is a full pull.
ui           health, viewport, core icon, 4-seg meter, shards, radial cds, core crosshair` },

      "power.md": { folder: "design", text: `1/4    one shot in gun · ejected core keeps 1
2/4    one shot in gun · ejected core keeps 2
3/4    one shot in gun · ejected core keeps 3
4/4    full pull from bandolier · no ejection

A core holds four shots. Firing consumes one charge. Reloads preserve remainder on the ejected core. UI is four segments; full meter gets the stronger glow.` },

      "combat.md": { folder: "design", text: `Fast, ability-driven, positioning-heavy. Decisions: when to fire, charge, crush, throw, combine, teleport, or conserve power.

## pvp
- Distinct strengths and weaknesses
- Clear counterplay
- Cooldowns against spam
- Meaningful resource spend

## risks
- Visual clutter
- Overpowered combinations
- Too many simultaneous effects
- Client perf` },

## acid

## void

      "combinations.md": { folder: "design", text: `Loaded core + thrown core, if they differ, writes a cataclysm. Swappable freely.

**plasma + acid**

Target shakes. Arcs crawl the body. Acid bubbles form on limbs, rupture from the arcs, spray out. Fade: blue-green puddle throwing plasma sparks.

**plasma + void**

Arcs slam in. Outline blue → white. Jitter. Rupture into shards that freeze mid-air. A tear drinks them. Shimmering crater remains.

**acid + void**

Acid eats chunks. Void shows through the holes. Puddles lift and warp, then ingest. A shadow-hollow flickers into purple shards.` },

      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function renderIni(text) {
      const lines = text.replace(/\r\n/g,"\n").split("\n");
      let html = "", kv = [];
      const flush = () => {
        if (!kv.length) return;
        html += `<div class="kv">${kv.map(([k,v]) => `<div class="k">${escapeHtml(k)}</div><div class="v">${escapeHtml(v)}</div>`).join("")}</div>`;
        kv = [];
      };
      lines.forEach((line) => {
        const t = line.trim();
        if (!t) return;
        if (t.startsWith("[") && t.endsWith("]")) { flush(); html += `<div class="sec">${escapeHtml(t)}</div>`; return; }
        const eq = t.indexOf("=");
        if (eq > 0) { kv.push([t.slice(0, eq + 1).trim(), t.slice(eq + 1).trim()]); return; }
        flush();
        html += `<div class="prose"><p>${escapeHtml(t)}</p></div>`;
      });
      flush();
      return html;
    }

    function renderMd(text) {
      const lines = text.replace(/\r\n/g,"\n").split("\n");
      let html = "", list = [], para = [];
      const flushList = () => {
        if (!list.length) return;
        html += `<ul class="list">${list.map((i) => `<li>${escapeHtml(i)}</li>`).join("")}</ul>`;
        list = [];
      };
      const flushPara = () => {
        if (!para.length) return;
        html += `<div class="prose"><p>${escapeHtml(para.join(" ")).replace(/\*\*(.+?)\*\*/g,'<span style="color:var(--fg-bright)">$1</span>')}</p></div>`;
        para = [];
      };
      lines.forEach((raw) => {
        const line = raw.replace(/\s+$/,"");
        const t = line.trim();
        if (!t) { flushList(); flushPara(); return; }
        if (t.startsWith("## ") || t.startsWith("# ")) { flushList(); flushPara(); html += `<div class="sec">${escapeHtml(t.replace(/^#+ /,""))}</div>`; return; }
        if (t.startsWith("- ")) { flushPara(); list.push(t.slice(2)); return; }
        const tab = line.match(/^(\S.{0,18}?)\s{2,}(.+)$/);
        if (tab) { flushList(); flushPara(); html += `<div class="kv"><div class="k">${escapeHtml(tab[1])}</div><div class="v">${escapeHtml(tab[2])}</div></div>`; return; }
        para.push(t);
      });
      flushList(); flushPara();
      return html;
    }

    function renderLua(text) {
      return `<div class="prose"><pre>${escapeHtml(text.trim())}</pre></div>`;
    }

    function renderFile(id, folder, text) {
      const path = folder ? folder + " / " + id : id;
      const ext = id.split(".").pop();
      let body = ext === "ini" ? renderIni(text) : ext === "lua" ? renderLua(text) : renderMd(text);
      if (id === "weapon.md") {
        body += `<div class="plate"><img src="${ART.gun}" alt="sidearm concept" /><div class="cap">source plate · sidearm</div></div>`;
      }
      if (id === "hud.md") {
        body += `<div class="plate"><img src="${ART.hud}" alt="hud concept" /><div class="cap">source plate · hud</div></div>`;
      }
      return `<div class="path"><span class="path-title">${escapeHtml(path)}</span><span class="caret"></span></div>${body}`;
    }

    const treeEl = document.getElementById("tree");
    const editor = document.getElementById("editor");
    const tab = document.getElementById("tab");
    const titleMid = document.getElementById("titleMid");
    const extEl = document.getElementById("ext");
    const statusName = document.getElementById("statusName");
    const sidebar = document.getElementById("sidebar");

    function buildTree() {
      let html = "";
      TREE.forEach((node) => {
        if (node.id) {
          html += `<button class="tree-file" data-id="${node.id}">${node.id}</button>`;
          return;
        }
        html += `<div class="tree-folder open nested"><button class="head"><span class="chev">▸</span> ${node.folder}</button><div class="kids">`;
        node.files.forEach((name) => { html += `<button class="tree-file" data-id="${name}">${name}</button>`; });
        html += `</div></div>`;
      });
      treeEl.innerHTML = html;
      treeEl.querySelectorAll(".tree-folder > .head").forEach((h) => {
        h.addEventListener("click", () => h.parentElement.classList.toggle("open"));
      });
    }

    function openFile(id) {
      const file = DOCS[id];
      if (!file) return;
      const ext = id.split(".").pop();
      document.querySelectorAll(".tree-file").forEach((b) => b.classList.toggle("on", b.dataset.id === id));
      tab.textContent = id;
      tab.style.animation = "none";
      void tab.offsetHeight;
      tab.style.animation = "";
      titleMid.textContent = id + " — dravex";
      extEl.textContent = ext;
      statusName.textContent = id;
      editor.classList.remove("swap");
      void editor.offsetHeight;
      editor.innerHTML = renderFile(id, file.folder, file.text);
      editor.classList.add("swap");
      if (window.innerWidth < 760) sidebar.classList.remove("open");
    }

    treeEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".tree-file");
      if (btn) openFile(btn.dataset.id);
    });
    document.getElementById("brand").addEventListener("click", () => sidebar.classList.toggle("open"));

    buildTree();
    openFile("welcome.ini");
  </script>
</body>
</html>
